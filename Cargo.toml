[package]
name = "claude-siesta"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
nix = { version = "0.31", features = ["signal", "process", "user"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
