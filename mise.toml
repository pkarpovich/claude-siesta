[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }

[tasks.build]
run = "cargo build"

[tasks.test]
run = "cargo test"

[tasks.lint]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.check]
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
]

[tasks.install]
run = '''
cargo build --release
mkdir -p "$HOME/.local/bin"
cp target/release/claude-siesta "$HOME/.local/bin/claude-siesta.tmp"
mv "$HOME/.local/bin/claude-siesta.tmp" "$HOME/.local/bin/claude-siesta"
"$HOME/.local/bin/claude-siesta" install
'''

[tasks.uninstall]
run = '"$HOME/.local/bin/claude-siesta" uninstall'
